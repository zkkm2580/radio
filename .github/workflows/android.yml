name: Build Android APK

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 20 * * *' # UTC 20:00 即北京时间 04:00
  workflow_dispatch:      # 支持手动在网页点击触发构建

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # 赋予上传 Release 权限

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-setuptools python3-dev \
            libffi-dev libssl-dev libltdl-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev cmake autoconf automake libtool pkg-config \
            uuid-dev liblzma-dev gettext autopoint

      - name: Install Buildozer and Cython
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "Cython<3.0" buildozer

      - name: Build APK
        run: |
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          buildozer android p4a -- --help > /dev/null 2>&1 || true
          mkdir -p $HOME/.android && touch $HOME/.android/repositories.cfg
          yes | $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true

          buildozer -v android debug
        env:
          BUILDOZER_ALLOW_KIVY_USER: 1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadioPlayer-Package
          path: bin/*.apk

      - name: Generate Release Tag
        id: tag
        run: |
          echo "release_tag=v$(date -u -d '+8 hours' +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
          echo "release_date=$(date -u -d '+8 hours' +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: "RadioPlayer 自动构建 (${{ steps.tag.outputs.release_date }})"
          files: bin/*.apk
          body: "RadioPlayer 每日定时构建版本，可直接下载 APK 安装测试。"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}